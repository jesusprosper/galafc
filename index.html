<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GALA FC</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="app">

  <header class="app-header">
  <div class="header-left">
    <img class="header-logo" src="assets/logos/galafc2.webp" alt="GALA FC">
    <div>
      <p class="eyebrow">Temporada 2025/26</p>
      <h1>GALA FC</h1>
    </div>
  </div>
</header>

    <main id="main-content">

      <section id="page-partidos" class="page active">
        <h2>Partidos</h2>
        <div id="next-match"></div>
        <h3 class="section-title">Próximos partidos</h3>
        <div id="upcoming-matches"></div>
      </section>

      <section id="page-resultados" class="page">
        <h2>Resultados</h2>
        <div id="results-list"></div>
      </section>

      <section id="page-clasificacion" class="page">
        <h2>Clasificación</h2>
        <div id="standings-table"></div>
      </section>

      <section id="page-plantilla" class="page">
        <h2>Plantilla</h2>
        <div id="squad-table"></div>
      </section>

      <section id="page-rankings" class="page">
        <h2>Rankings</h2>
        <div id="rankings-content"></div>
      </section>

      <section id="page-match-detail" class="page detail-page">
        <button class="back-btn" id="back-from-match">← Volver</button>
        <div id="match-detail-content"></div>
      </section>

      <section id="page-player-detail" class="page detail-page">
        <button class="back-btn" id="back-from-player">← Volver</button>
        <div id="player-detail-content"></div>
      </section>

    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-page="partidos">
        <span>⚽</span>
        <small>Partidos</small>
      </button>

      <button class="nav-item" data-page="resultados">
        <span>📋</span>
        <small>Resultados</small>
      </button>

      <button class="nav-item" data-page="clasificacion">
        <span>📊</span>
        <small>Clasificación</small>
      </button>

      <button class="nav-item" data-page="plantilla">
        <span>👥</span>
        <small>Plantilla</small>
      </button>

      <button class="nav-item" data-page="rankings">
        <span>🏆</span>
        <small>Rankings</small>
      </button>
    </nav>

  </div>

  <script type="module" src="script.js?v=29"></script>
</body>
</html>
